[project]
name = "pre-symphony"
version = "0.0.1"
description = "Turn a coding-agent's SPEC-based plan into Symphony-friendly Linear issues."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pre-symphony = "pre_symphony.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pre_symphony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
